<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>The Right Hand Wants. - 埃內亞的故事</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

.container {
  display: flex;
  flex-direction: row;
  height: 100%;
}

#map-frame {
  width: 50%;
  height: 100%;
  border: none;
}

.details-container {
  width: 50%;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #fdfdf9;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px 0;
  position: sticky;
  top: 0;
  z-index: 10;
  background: #fdfdf9;
  border-bottom: 1px solid #bfa78a;
}

.music-controls {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.current-song {
  font-size: 14px;
  color: #3a2f2a;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}

.menu-toggle,
.music-toggle,
.random-song {
  cursor: pointer;
  color: #3a2f2a;
  background: none;
  border: none;
  border-radius: 6px;
  line-height: 1;
}

.menu-toggle {
  font-size: 24px;
  padding: 10px;
}

.music-toggle,
.random-song {
  font-size: 14px;
  padding: 8px 12px;
}

.music-toggle:hover,
.menu-toggle:hover,
.random-song:hover {
  background: #e7ddc5;
}

.menu {
  display: none;
  background: #fdfdf9;
  border-bottom: 1px solid #bfa78a;
  overflow-y: auto;
}

.menu.open {
  display: block;
  max-height: 200px;
}

.menu a {
  display: block;
  padding: 5px 10px;
  color: #3a2f2a;
  text-decoration: none;
  border-bottom: 1px solid #eee;
}

.menu a:hover {
  background-color: #f1e7dd;
}

iframe#details {
  flex: 1;
  width: 100%;
  border: none;
}

#player {
  position: absolute;
  left: -9999px;
  top: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

@media (max-width: 767px) {
  .container {
    flex-direction: column;
  }

  #map-frame {
    width: 100%;
    height: 33%;
  }

  .details-container {
    width: 100%;
    height: 67%;
  }

  #details {
    width: 100%;
    height: calc(100% - 40px);
  }

  .menu-toggle,
  .music-toggle,
  .random-song {
    font-size: 1.1em;
  }

  .current-song {
    max-width: 120px;
    font-size: 12px;
  }

  .menu.open {
    max-height: 200px;
    overflow-y: auto;
  }
}
</style>
</head>
<body>

<div class="container">
  <iframe src="map.html" id="map-frame"></iframe>

  <div class="details-container">
    <div class="controls">
      <div class="menu-toggle" id="menu-toggle">☰</div>

      <div class="music-controls">
        <div class="current-song" id="current-song">Loading...</div>
        <button class="random-song" id="random-song" type="button">⇄</button>
        <button class="music-toggle" id="music-toggle" type="button">▶︎</button>
      </div>
    </div>

    <div class="menu" id="menu"></div>
    <iframe id="details" name="details-frame" src="details/main.html"></iframe>
  </div>
</div>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="js/main.js"></script>

</body>
</html>
