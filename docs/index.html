<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>The Right Hand Wants. - 埃內亞的故事</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

.container {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.details-container {
  display: flex;
  flex-direction: column;
  width: 50%;
  height: 100%;
}

.menu-toggle {
  align-self: flex-end;
  cursor: pointer;
  font-size: 24px;
  padding: 5px;
}

.menu {
  display: none; /* 預設不顯示 */
  background: #fff;
  border-bottom: 1px solid #ccc;
  overflow-y: auto;
}

.menu.open {
  display: block;
}

.menu a {
  display: block;
  padding: 5px 10px;
  color: #333;
  text-decoration: none;
}

.menu-item:hover {
  background-color: #eee;
}

iframe#details {
  flex: 1;
  width: 100%;
  border: none;
}

#map-frame, #details {
  border: none;
}

#map-frame {
  width: 100%;
  height: 33%;
}

#details {
  width: 100%;
  height: 67%;
}

/* 桌機模式 */
@media (min-width: 768px) {
  .container {
    flex-direction: row;
  }
  #map-frame, #details {
    width: 50%;
    height: 100%;
  }
}
</style>
</head>
<body>

<div class="container">
  <iframe src="map.html" id="map-frame"></iframe>

  <div class="details-container">
    <div class="menu-toggle" id="menu-toggle">☰</div>
    <div class="menu" id="menu"></div>
    <iframe id="details" name="details-frame" src="details/main.html"></iframe>
  </div>
</div>

<script src="js/main.js"></script>

</body>
</html>
