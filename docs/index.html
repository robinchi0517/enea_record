<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>The Right Hand Wants. - 埃內亞的故事</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #fdfdf9;
}

.container {
  display: flex;
  flex-direction: row; /* 預設為左右 */
  height: 100%;
}

/* 地圖 iframe */
#map-frame {
  width: 50%;
  height: 100%;
  border: none;
}

/* 右側容器：選單 + 詳細內容 */
.details-container {
  width: 50%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* 選單開關按鈕 */
.menu-toggle {
  align-self: flex-end;
  cursor: pointer;
  font-size: 24px;
  padding: 10px;
  height: 40px;
  line-height: 20px;
}

/* 選單 */
.menu {
  display: none;
  background: #fdfdf9;
  border-bottom: 1px solid #bfa78a;
  overflow-y: auto;
}

.menu.open {
  display: block;
  max-height: 200px;
}

.menu a {
  display: block;
  padding: 5px 10px;
  color: #3a2f2a;
  text-decoration: none;
  border-bottom: 1px solid #eee;
}

.menu a:hover {
  background-color: #f1e7dd;
}

/* 詳細內容 iframe */
iframe#details {
  flex: 1;
  width: 100%;
  border: none;
}

/* 📱 手機模式：上下分割 */
@media (max-width: 767px) {
  .container {
    flex-direction: column;
  }

  #map-frame {
    width: 100%;
    height: 33%;
  }

  .details-container {
    width: 100%;
    height: 67%;
  }

  #details {
    width: 100%;
    height: calc(100% - 40px); /* 減去選單 toggle 的高度 */
  }

  .menu-toggle {
    font-size: 1.0em;
    background: #fdfdf9;
  }

  .menu.open {
    max-height: 200px;
    overflow-y: auto;
  }
}


</style>
</head>
<body>

<div class="container">
  <iframe src="map.html" id="map-frame"></iframe>

  <div class="details-container">
    <div class="menu-toggle" id="menu-toggle">☰</div>
    <div class="menu" id="menu"></div>
    <iframe id="details" name="details-frame" src="details/main.html"></iframe>
  </div>
</div>


<script src="js/main.js"></script>

</body>
</html>
